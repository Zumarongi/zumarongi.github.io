name: Deploy Astro site to Github Pages

on:
  push:
    branches:
      - main                  # 每次推送到 main 分支时触发（若你用 master，请改这里）
  workflow_dispatch:          # 允许你在 GitHub Actions 页面手动触发

permissions:
  contents: read              # 允许读取仓库内容
  pages: write                # 允许写入 GitHub Pages 部署内容
  id-token: write             # 允许使用 GitHub 的安全身份验证令牌（OIDC）

defaults:
  run:
    working-directory: ./ignoramuz

jobs:
  build:
    name: Build Astro site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.2.0
          cache: npm
          cache-dependency-path: ignoramuz/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ignoramuz/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
